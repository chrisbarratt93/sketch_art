[project]
name = "sketchart"
version = "0.1.0"
description = "Photo to pen-plotter ink drawing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    # contrib build: provides cv2.ximgproc (structured edge forests)
    "opencv-contrib-python-headless>=4.10",
    "scikit-image>=0.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Learned edge detection (TEED). On Linux, PyPI's torch wheel bundles CUDA;
# see README for a CPU-only index if you want a smaller install.
learned = ["torch>=2.4"]
# Hugging Face models (see MODELS.md): extra edge detectors via controlnet-aux,
# segmentation and depth via transformers. Weights download on first use.
hub = [
    "torch>=2.4",
    "torchvision",
    "controlnet-aux>=0.0.10",
    "transformers>=4.45",
    "huggingface-hub",
]

[tool.uv]
package = false
# controlnet-aux pulls in opencv-python-headless, which would overwrite the
# cv2 package from opencv-contrib-python-headless (we need cv2.ximgproc).
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]
